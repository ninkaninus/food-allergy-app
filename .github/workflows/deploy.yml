# CI-halvdelen af auto-deploy. Se deploy/UNRAID.md for hele billedet.
#
# Push til main  ->  testene kører  ->  image bygges og udgives til GHCR,
# tagget med commit-SHA'en. Serveren poller selv og henter det (pull-baseret,
# som Argo CD): GitHub har INGEN adgang til serveren, ingen SSH-nøgler,
# ingen webhooks ind. Fejler én test — herunder de fire invariant-tests —
# udgives der intet image, og serveren har ingenting at rulle ud.

name: Test, byg og udgiv

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # OCR-integrationstestene kræver Tesseract med dansk sprogmodel og en
      # font — lokalt springes de over, her kører de altid.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
             tesseract-ocr tesseract-ocr-dan fonts-dejavu-core
      # Frontendens vagter køres i node med en DOM-stub
      # (tests/frontend_stub.mjs). De springes over, hvis node mangler —
      # og en oversprunget test er ikke en grøn test, så den installeres
      # eksplicit i stedet for at stole på kørerens billede.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -q

  # Sikkerhedsnettet: hvis nogen nogensinde committer en rigtig hemmelighed
  # eller en database, fanges det her i stedet for på GitHub.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ingen hemmeligheder eller databaser i træet
        run: |
          fail=0
          for f in .env deploy/Caddyfile deploy/authelia/configuration.yml \
                   deploy/authelia/users_database.yml deploy/authelia/db.sqlite3; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f er committet — den skal være gitignoreret"
              fail=1
            fi
          done
          if git ls-files | grep -E '\.(db|sqlite3?)$'; then
            echo "::error::en database er committet"
            fail=1
          fi
          # Familiens regneark er deres egne data — se NOTICE.md og
          # .claude/skills/familiens-data. Det er den ene fil, der aldrig
          # må i git, og den var ikke dækket før.
          if git ls-files | grep -E '\.(xlsx|xls|ods)$'; then
            echo "::error::et regneark er committet — det er familiens egne data"
            fail=1
          fi
          # Deklarationsfotos er taget i familiens køkken og i butikker.
          # Repoet er PUBLIC, og git glemmer ikke — heller ikke efter en
          # sletning. Vagten kommer FØR eksportværktøjet i samme udgivelse
          # med vilje: så er det ikke disciplin, der holder billederne ude.
          # Hvidlisten er eksplicit; skal der en legitim billedfil ind, er
          # det en bevidst handling at udvide den her.
          # BEMÆRK hvad denne vagt IKKE gør: den kører EFTER et push til et
          # public repo. Den stopper udgivelsen af imaget — den forhindrer
          # ikke selve eksponeringen, for indholdet har allerede ligget på
          # GitHub, og git glemmer ikke. Kun en lokal pre-commit-hook ville
          # nå det i tide. Jobbet ER disciplinen, bare sent i forløbet.
          BILLED_HVIDLISTE='^app/static/apple-touch-icon\.png$'
          if git ls-files | grep -iE '\.(jpe?g|png|heic|heif|webp|gif|tiff?|bmp|avif|jfif|dng|pdf)$' \
               | grep -Ev "$BILLED_HVIDLISTE"; then
            echo "::error::et billede er committet — familiens fotos må aldrig i git."
            echo "::error::Er det en legitim ikonfil, så udvid BILLED_HVIDLISTE i dette job."
            fail=1
          fi
          # manifest.json fra scripts/hent-korpus.py er husstandens FULDE
          # varefortegnelse — hvert EAN, hvert navn, hver deklaration i én
          # fil. Den er den mest sandsynlige fil at få committet fra en
          # korpusmappe, og en endelsesregel ser den ikke.
          if git ls-files | grep -E '(^|/)manifest\.json$'; then
            echo "::error::manifest.json er committet — det er husstandens fulde varefortegnelse"
            fail=1
          fi
          # Et billede uden filendelse fanges ikke af noget navnemønster.
          while IFS= read -r f; do
            case "$(basename "$f")" in *.*) continue ;; esac
            # Læs fra arbejdstræet, ikke fra HEAD: efter actions/checkout
            # ligger filen på disken, og `git cat-file HEAD:` ville desuden
            # være blind for noget, der er tilføjet men endnu ikke committet.
            mime=$(file -b --mime-type "$f" 2>/dev/null)
            case "$mime" in
              image/*|application/pdf)
                echo "::error::$f har ingen filendelse, men ER et billede ($mime)"
                fail=1 ;;
            esac
          done < <(git ls-files)
          exit $fail

  # Bygger imaget OG starter det. Et image, der bygger fint men dør ved
  # opstart, ville ellers blive udgivet — serveren henter det, healthcheck
  # timer ud efter 90 s, og den automatiske tilbagerulning fyrer.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Byg image
        run: docker build -t allergiscan:ci .
      - name: Containeren svarer på /healthz
        run: |
          # TILLAD_SQLITE=1: appen nægter siden 0.21.1 at starte uden at
          # vide, hvilken database den kigger i (app/db.py). Her ER en
          # frisk, tom SQLite-fil det rigtige — vi tester at imaget
          # starter, ikke at det finder familiens data.
          docker run -d --name ci -p 8000:8000 \
            -e TILLAD_SQLITE=1 \
            -e COOKIE_SECURE=0 -e CHECK_PWNED_PASSWORDS=0 allergiscan:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break || sleep 2
          done
          curl -fsS http://localhost:8000/healthz
          docker logs ci

      - name: ... og nægter at starte uden at vide hvilken database
        run: |
          # Modprøven. Uden den kunne nogen fjerne vagten i app/db.py, og
          # alt ville stadig være grønt — mens en manglende DATABASE_URL i
          # drift igen ville give en tom database og et grønt healthcheck.
          docker rm -f ci >/dev/null 2>&1 || true
          docker run -d --name ci2 -p 8001:8000 \
            -e COOKIE_SECURE=0 -e CHECK_PWNED_PASSWORDS=0 allergiscan:ci
          sleep 12
          if curl -fsS --max-time 3 http://localhost:8001/healthz >/dev/null 2>&1; then
            echo "::error::containeren startede UDEN at vide hvilken database den bruger"
            docker logs ci2
            exit 1
          fi
          docker logs ci2 2>&1 | grep -q TILLAD_SQLITE \
            || { echo "::error::opstarten fejlede, men sagde ikke hvorfor"; docker logs ci2; exit 1; }
          echo "vagten holder: containeren nægter at starte, og siger hvorfor"

  byg-og-udgiv:
    # Kun rigtige push til main udgiver — pull requests testes bare.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # ALLE tre porte, ikke kun testene. hygiene og docker lå før i
    # ci.yml, altså et andet workflow, og kunne derfor ikke blokere en
    # udgivelse — de kørte ved siden af og var langsommere end den.
    needs: [test, hygiene, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GITHUB_TOKEN må skrive til GHCR; ingen egne secrets.
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # sha-tagget er det, serveren deployer efter — det pinner imaget
          # til præcis den commit, den har hentet compose-filerne fra.
          # latest er kun til manuel brug.
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      # OCR-tjenesten er sit eget image med sine egne modeller. Samme
      # sha-tag, så app og OCR altid ruller ud som ét par.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ocr
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-ocr:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}-ocr:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
