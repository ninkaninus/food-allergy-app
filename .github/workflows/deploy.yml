# CI-halvdelen af auto-deploy. Se deploy/UNRAID.md for hele billedet.
#
# Push til main  ->  testene kører  ->  image bygges og udgives til GHCR,
# tagget med commit-SHA'en. Serveren poller selv og henter det (pull-baseret,
# som Argo CD): GitHub har INGEN adgang til serveren, ingen SSH-nøgler,
# ingen webhooks ind. Fejler én test — herunder de fire invariant-tests —
# udgives der intet image, og serveren har ingenting at rulle ud.

name: Test, byg og udgiv

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # OCR-integrationstestene kræver Tesseract med dansk sprogmodel og en
      # font — lokalt springes de over, her kører de altid.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
             tesseract-ocr tesseract-ocr-dan fonts-dejavu-core
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -q

  byg-og-udgiv:
    # Kun rigtige push til main udgiver — pull requests testes bare.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GITHUB_TOKEN må skrive til GHCR; ingen egne secrets.
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # sha-tagget er det, serveren deployer efter — det pinner imaget
          # til præcis den commit, den har hentet compose-filerne fra.
          # latest er kun til manuel brug.
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      # OCR-tjenesten er sit eget image med sine egne modeller. Samme
      # sha-tag, så app og OCR altid ruller ud som ét par.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ocr
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-ocr:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}-ocr:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
