# Allergen-regler for AllergiScan
#
# LÆSEREKKEFØLGE I MATCHEREN (vigtigt):
#   1. "exclude" maskeres ud af teksten FØRST (erstattes med ░-blokke)
#   2. derefter køres "contains" og "maybe" på den maskerede tekst
#
# Hvorfor: dansk sammensætter ord. "kakaosmør" indeholder "smør",
# "kokosmælk" indeholder "mælk", "ægte vanilje" indeholder "æg",
# "mælkebøtte" indeholder "mælke". Uden maskering får du falske røde.
#
# Matcheren kræver desuden ordgrænse FØR mønsteret: (?<![a-zæøå])
# Det gør at "mælk" rammer "mælkepulver" (præfiks) men ikke "kokosmælk" (suffiks).
# Sammensætninger hvor allergenet står bagest skal derfor stå eksplicit
# i "contains" — fx "kærnemælk", "skummetmælk", "sødmælk".

allergens:

  - slug: maelkeprotein
    name_da: Mælkeprotein
    name_en: Milk protein
    off_tag: "en:milk"        # EU-14 → allergens_tags er brugbar når den findes
    eu14: true
    note: >
      Laktosefri er IKKE mælkeproteinfri. Laktosefri mælk indeholder fuld
      mængde kasein og valle. Reglerne nedenfor maskerer "laktosefri" væk,
      så et efterfølgende "mælk" stadig fanges.
    contains:
      # basis
      - mælk
      - komælk
      - sødmælk
      - letmælk
      - minimælk
      - skummetmælk
      - kærnemælk
      - tykmælk
      - kondenseret mælk
      - koncentreret mælk
      - mælkepulver
      - mælketørstof
      - mælkefedt
      - mælkeprotein
      - modermælkserstatning
      - mysepulver
      - mysost
      # Danske ostenavne uden "-ost" bagest. Lookbehind'en kræver
      # ordgrænse FØR mønsteret, så "feta" og "brie" skal stå eksplicit —
      # de fanges ikke af noget andet mønster. Fundet ved gennemgang
      # 2026-08-21: kun de italienske stod på listen.
      - feta
      - halloumi
      - hytteost
      - salatost
      - gedeost
      - fåreost
      - brie
      - camembert
      - gouda
      - havarti
      - danbo
      - emmental
      - gorgonzola
      - pecorino
      - grana padano
      - gedemælk
      - fåremælk
      - råmælk
      - surmælk
      # protein-fraktioner (de farlige, som folk overser)
      - kasein
      - kaseinat
      - caseinat
      - casein
      - natriumkaseinat
      - calciumkaseinat
      - laktalbumin
      - laktoglobulin
      - lactoglobulin
      - valle
      - vallepulver
      - valleprotein
      - vallepermeat
      - vallepulverkoncentrat
      # forarbejdet mejeri
      - fløde
      - piskefløde
      - flødepulver
      - madlavningsfløde
      - creme fraiche
      - crème fraîche
      - smør
      - smørfedt
      - ghee
      - ost
      - oste
      - skæreost
      - flødeost
      - smøreost
      - parmesan
      - mozzarella
      - mascarpone
      - ricotta
      - cheddar
      - yoghurt
      - ymer
      - skyr
      - kefir
      - a38
      - kvark
      # engelsk (mange etiketter er flersprogede)
      - milk
      - whey
      - butter
      - buttermilk
      - cream
      - cheese
      - curd
      - milk solids
      - milk powder
      - skimmed milk
      - lactalbumin
    maybe:
      - mælkesyrekultur       # kan være vegansk, men står ofte i mejeri
      - starterkultur
      - naturligt aroma
      - smøraroma
      - butter flavour
    exclude:
      # negationer — maskeres, så resten af sætningen stadig kan matche
      - mælkefri
      - laktosefri
      - lactose free
      - lactose-free
      - dairy free
      - dairy-free
      - uden mælk
      - milk free
      # plantebaserede "mælke" og "smør"
      - kokosmælk
      - sojamælk
      - havremælk
      - rismælk
      - mandelmælk
      - cashewmælk
      - hampemælk
      - nøddemælk
      - kokosfløde
      - kokossmør
      - kakaosmør
      - sheasmør
      - jordnøddesmør
      - mandelsmør
      - nøddesmør
      - peanut butter
      - cocoa butter
      - shea butter
      - coconut milk
      - soy milk
      - oat milk
      - almond milk
      - rice milk
      # helt andre ord der tilfældigvis starter med mælk/ost/valle
      - mælkebøtte           # mælkebøtterod
      - mælkesyre            # E270, normalt vegansk
      - mælkesyrebakterier
      - lactic acid
      - ostindisk
      - vallensbæk

  - slug: aeg
    name_da: Æg
    name_en: Egg
    off_tag: "en:eggs"
    eu14: true
    note: >
      "ægte" er den klassiske falske positiv på dansk — "ægte vanilje",
      "ægte lakrids". Den maskeres væk før matchning.
    contains:
      - æg
      - helæg
      - andeæg
      - vagtelæg
      - hønseæg
      - æggeblomme
      - æggehvide
      - æggemasse
      - æggepulver
      - ægpulver
      - tørret æg
      - pasteuriseret æg
      - flydende æg
      - ovalbumin
      - ægalbumin
      - konalbumin
      - ovomucoid
      - livetin
      - vitellin
      - globulin
      - lysozym
      - e1105                 # lysozym, udvindes af æggehvide
      - mayonnaise
      - remoulade
      - marengs
      - bearnaise
      - hollandaise
      - egg
      - eggs
      - albumen
      - egg white
      - egg yolk
    maybe:
      - lecithin              # oftest soja, men kan være æg
      - lecitin
      - e322
      - emulgator
      - albumin               # kan også være mælke- eller plantealbumin
    exclude:
      - ægte
      - ægteskab
      - æggeplante            # aubergine
      - ægløsning
      - eggplant

  - slug: gluten
    name_da: Gluten
    name_en: Gluten
    off_tag: "en:gluten"
    eu14: true
    note: >
      "boghvede" er glutenfri og må aldrig ramme "hvede" — lookbehind klarer
      eksakt match, men OCR-fuzzy kigger i vinduer inde i ord, så boghvede
      SKAL stå i exclude. Samme historie: "hvide" (bønner) er én redigering
      fra "hvede", "smeltet" én fra "spelt", og maltodextrin/maltose er
      glutenfrie trods "malt"-præfikset.
    contains:
      - gluten
      - hvede
      - fuldkornshvede
      - durumhvede
      - ølandshvede
      - durum
      - semulje
      - mannagryn
      - grahamsmel
      - couscous
      - bulgur
      - seitan
      - rug
      - fuldkornsrug
      - byg
      - perlebyg
      - malt
      - maltekstrakt
      - havre
      - spelt
      - kamut
      - øl
      - wheat
      - rye
      - barley
      - oat
      - oats
      - semolina
    exclude:
      - glutenfri
      - gluten-fri
      - gluten free
      - gluten-free
      - boghvede            # glutenfri pseudo-kornart — også vigtig for OCR-fuzzy
      - maltodextrin        # glutenfrit trods navnet
      - maltodekstrin
      - maltose
      - maltitol
      - maltit
      - maltol
      - hvide               # "hvide bønner" er ét OCR-fejltrin fra "hvede"
      - smelt               # "smeltet smør" er ét OCR-fejltrin fra "spelt"

  - slug: krebsdyr
    name_da: Krebsdyr
    name_en: Crustaceans
    off_tag: "en:crustaceans"
    eu14: true
    note: >
      "varenummer" er én OCR-redigering fra "hummer", og "grillet" én fra
      "krill" — derfor de mærkelige exclude-poster. "skaldyr" dækker både
      krebsdyr og bløddyr og er derfor kun maybe.
    contains:
      - krebsdyr
      - reje
      - tigerreje
      - kæmpereje
      - dybvandsreje
      - krabbe
      - hummer
      - jomfruhummer
      - krebs
      - langust
      - kongekrabbe
      - taskekrabbe
      - flodkrebs
      - scampi
      - krill
      - shrimp
      - prawn
      - crab
      - lobster
      - crayfish
    maybe:
      - skaldyr
      - surimi              # fiskefars, men ofte med krebsdyrsmag/ekstrakt
    exclude:
      - nummer
      - varenummer
      - batchnummer
      - lotnummer
      - grill

  - slug: fisk
    name_da: Fisk
    name_en: Fish
    off_tag: "en:fish"
    eu14: true
    note: >
      "tunge" kan være både søtunge (fisk) og oksetunge (okse) — derfor er
      den maybe, og maskeringen af maybe før contains-passet forhindrer
      samtidig, at "tun" bliver rød på "tunge". "norsk" er én OCR-redigering
      fra "torsk". Sammensætninger med -fisk bagest står eksplicit.
    contains:
      - fisk
      - tunfisk
      - sværdfisk
      - hellefisk
      - klipfisk
      - tørfisk
      - torsk
      - laks
      - tun
      - makrel
      - alaskasej
      - mørksej
      - kulmule
      - helleflynder
      - rødfisk
      - pollock
      - sild
      - brisling
      - sardin
      - ansjos
      - rødspætte
      - skrubbe
      - kuller
      - ørred
      - pangasius
      - tilapia
      - søtunge
      - rødtunge
      - surimi
      - kaviar
      - rogn
      - fish
      - salmon
      - tuna
      - herring
      - mackerel
      - anchovy
      - anchovies
      - sardine
    maybe:
      - tunge
      - worcestershiresauce   # indeholder klassisk ansjos
      - worcestershire sauce
      - omega-3               # ofte fiskeolie, men kan være alger
    exclude:
      - norsk

  - slug: jordnoed
    name_da: Jordnødder
    name_en: Peanuts
    off_tag: "en:peanuts"
    eu14: true
    note: >
      Jordnød er en bælgfrugt, ikke en nød — den har sin egen post, og
      "nødder"-posten udelukker den tilsvarende. Jordnøddeolie er IKKE
      undtaget i EU's mærkningsregler og forbliver rød.
    contains:
      - jordnød
      - peanut
      - peanuts
      - arachisolie
      - arachis

  - slug: soja
    name_da: Soja
    name_en: Soy
    off_tag: "en:soybeans"
    eu14: true
    note: >
      Præfikset dækker sojamælk, sojaolie, sojalecithin osv. Bemærk at
      sojamælk står i mælkeproteinets exclude men er CONTAINS her — det er
      hele pointen med per-allergen-regler. Ren lecithin uden angivet kilde
      er maybe, som under æg.
    contains:
      - soja
      - soya
      - soy
      - soybean
      - tofu
      - edamame
      - miso
      - tempeh
      - tamari
    maybe:
      - lecithin
      - lecitin
      - e322
      - vegetabilsk protein

  - slug: noedder
    name_da: Nødder
    name_en: Tree nuts
    off_tag: "en:nuts"
    eu14: true
    note: >
      EU's liste er otte arter — hverken muskatnød, kokosnød eller jordnød
      hører til, og alle tre skal i exclude, fordi OCR-fuzzy ellers finder
      "nødde" i vinduer inde i ordene. "nødvendig" ("rystes om nødvendigt")
      er én redigering fra "nødde" og ryger med af samme grund.
      Mandelaroma er som jordbæraroma: gul, ikke rød.
    contains:
      - nødde
      - nødder
      - mandel
      - mandler
      - bittermandel
      - marcipan
      - råmarcipan
      - marzipan
      - nougat
      - nugat
      - hasselnød
      - valnød
      - cashew
      - pekan
      - pekannød
      - paranød
      - pistacie
      - pistache
      - macadamia
      - almond
      - hazelnut
      - walnut
      - pecan
      - pistachio
      - brazil nut
      - nuts
    maybe:
      - mandelaroma         # ofte syntetisk, men verificér
      - nøddearoma
      - pralin
    exclude:
      - muskatnød           # krydderi, ikke nød
      - kokosnød            # ikke på EU's nøddeliste
      - jordnød             # egen post — bælgfrugt, ikke nød
      - nødvendig

  - slug: selleri
    name_da: Selleri
    name_en: Celery
    off_tag: "en:celery"
    eu14: true
    note: >
      Knold- og bladselleri har allergenet bagest og skal stå eksplicit.
      Skjult selleri i krydderiblandinger SKAL deklareres efter EU-reglerne,
      så "krydderier" alene udløser ingenting.
    contains:
      - selleri
      - knoldselleri
      - bladselleri
      - stangselleri
      - blegselleri
      - celery

  - slug: sennep
    name_da: Sennep
    name_en: Mustard
    off_tag: "en:mustard"
    eu14: true
    contains:
      - sennep
      - dijonsennep
      - mustard

  - slug: sesam
    name_da: Sesam
    name_en: Sesame
    off_tag: "en:sesame-seeds"
    eu14: true
    note: >
      Tahin er ren sesam og altid rød. Hummus og halva laves NÆSTEN altid
      med sesam, men ikke altid — gul, producenten tjekkes. "tahiti"
      (vanilje) er én OCR-redigering fra "tahin", deraf exclude.
    contains:
      - sesam
      - tahin
      - tahini
      - sesame
    maybe:
      - hummus
      - humus
      - halva
    exclude:
      - tahiti

  - slug: sulfit
    name_da: Svovldioxid og sulfitter
    name_en: Sulphur dioxide and sulphites
    off_tag: "en:sulphur-dioxide-and-sulphites"
    eu14: true
    note: >
      Sammensætningerne (natriumsulfit osv.) har allergenet bagest og står
      eksplicit, sammen med E220-E228. Sulfat er IKKE sulfit — ét bogstav
      og én OCR-redigering i forskel, så de ufarlige sulfater står i
      exclude, både alene og i deres almindelige sammensætninger.
    contains:
      - svovldioxid
      - sulfit
      - sulfitter
      - natriumsulfit
      - natriumhydrogensulfit
      - natriumbisulfit
      - natriumdisulfit
      - natriummetabisulfit
      - kaliummetabisulfit
      - kaliumdisulfit
      - kaliumhydrogensulfit
      - calciumsulfit
      - calciumhydrogensulfit
      - e220
      - e221
      - e222
      - e223
      - e224
      - e226
      - e227
      - e228
      - sulphite
      - sulfite
      - sulphur dioxide
      - sulfur dioxide
    exclude:
      - sulfat
      - calciumsulfat       # E516, ufarligt
      - magnesiumsulfat     # E518, ufarligt
      - ammoniumsulfat      # E517, ufarligt
      - jernsulfat          # kosttilskud, ufarligt for sulfit-allergikere

  - slug: lupin
    name_da: Lupin
    name_en: Lupin
    off_tag: "en:lupin"
    eu14: true
    note: >
      Dukker op som lupinmel i glutenfrit bagværk — præcis dér, hvor man
      tror man har købt sig fri af problemer.
    contains:
      - lupin
      - lupine

  - slug: bloeddyr
    name_da: Bløddyr
    name_en: Molluscs
    off_tag: "en:molluscs"
    eu14: true
    note: >
      "kanelsnegle" indeholder ordret "snegl", og OCR-fuzzy finder det i
      vinduet — deraf exclude. "Østersøen" ("fanget i Østersøen") er ét
      vindue fra "østers" af samme grund. Blå-/kammusling har allergenet
      bagest og står eksplicit.
    contains:
      - bløddyr
      - musling
      - blåmusling
      - kammusling
      - hjertemusling
      - venusmusling
      - østers
      - østerssauce
      - vinbjergsnegl
      - sandmusling
      - blæksprutte
      - calamari
      - snegl
      - mussel
      - mussels
      - oyster
      - squid
      - octopus
      - scallop
      - clam
    maybe:
      - skaldyr
    exclude:
      - kanelsnegl
      - østersø

  - slug: jordbaer
    name_da: Jordbær
    name_en: Strawberry
    off_tag: null             # IKKE på EU-14-listen → kun fritekst virker
    eu14: false
    note: >
      Findes ikke i allergens_tags. Skal altid findes i ingredienslisten.
      "Bærblanding" og "røde frugter" giver derfor MAYBE, ikke CONTAINS —
      producenten skal ringes op.
    contains:
      - jordbær
      - skovjordbær
      - markjordbær
      - vildjordbær
      - jordbærpuré
      - jordbærpure
      - jordbærsaft
      - jordbærkoncentrat
      - jordbærstykker
      - jordbærmarmelade
      - fragaria
      - strawberry
      - strawberries
    maybe:
      - jordbæraroma          # ofte syntetisk, men verificér
      - bærblanding
      - bærmix
      - blandede bær
      - skovbær
      - røde bær
      - røde frugter
      - frugtblanding
      - frugtkoncentrat
      - bærpuré
      - berry
      - mixed berries
      - red fruits
    exclude:
      - jordbærplante
      - jordbærkløver

  - slug: banan
    name_da: Banan
    name_en: Banana
    off_tag: null
    eu14: false
    note: >
      Som jordbær — ikke EU-14. Bananmel dukker op i glutenfri bagværk,
      og "tropisk frugtblanding" er næsten altid banan.
    contains:
      - banan
      - bananpuré
      - bananpure
      - bananmel
      - bananflager
      - bananchips
      - bananstykker
      - grøn banan
      - banana
      - plantain
    maybe:
      - tropisk frugtblanding
      - tropisk frugt
      - smoothie
      - frugtblanding
      - frugtpuré
      - tropical fruit
    exclude:
      - bananfluer

  - slug: tomat
    name_da: Tomat
    name_en: Tomato
    off_tag: null
    eu14: false
    note: >
      Som jordbær og banan — ikke EU-14, findes kun i fritekst. Ketchup og
      passata ER tomat. "automat" og "aromatiseret" er OCR-vinduer fra
      "tomat", og tomatillo er en anden plante — deraf de tre exclude.
    contains:
      - tomat
      - cherrytomat
      - blommetomat
      - cocktailtomat
      - datteltomat
      - ketchup
      - passata
      - tomato
    maybe:
      - salsa
    exclude:
      - tomatillo
      - automat
      - aromatiseret
      - aromatisk

# Generelle sporadvarsler — matches på tværs af alle allergener.
# Giver aldrig CONTAINS, kun TRACE_RISK.
trace_markers:
  - kan indeholde spor af
  - kan indeholde spor
  - kan indeholde
  - fremstillet på et anlæg
  - fremstillet på fabrik
  - produceret på et anlæg
  - hvor der også anvendes
  - hvor der også håndteres
  - may contain traces
  - may contain
  - produced in a facility
  - manufactured on equipment
