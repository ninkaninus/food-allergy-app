# unRAID: /mnt/user/appdata/allergiscan
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d --build
#   docker compose exec allergiscan python -m app.cli adduser dig@example.dk "William"
#
# Valgfrie profiler:
#   docker compose --profile postgres up -d   # Postgres i stedet for SQLite
#   docker compose --profile proxy up -d      # Caddy + Authelia
#   docker compose --profile tunnel up -d     # Cloudflare Tunnel (se deploy/cloudflared/)
#
# Alle indstillinger kommer fra .env, som er gitignoreret. Se .env.example.

services:
  allergiscan:
    build: .
    # Auto-deploy pinner APP_IMAGE til ghcr.io/...:sha-<commit> i .env
    # (se deploy/autodeploy.sh). Uden APP_IMAGE bygges og køres lokalt
    # som hidtil: docker compose up -d --build
    image: "${APP_IMAGE:-allergiscan:local}"
    container_name: allergiscan
    restart: unless-stopped
    ports:
      # Default binder kun til loopback: tunnellen taler til containeren over
      # Docker-netværket, og /healthz kan nås fra hosten — men der er ingen
      # vej ind fra LAN udenom Cloudflare. Sæt APP_BIND=0.0.0.0 i .env for
      # at teste over LAN (kameraet virker dog kun over HTTPS, se cloudflared/).
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8420}:8000"
    volumes:
      - ${DATA_PATH:-./data-runtime}:/data
      # Reglerne kan rettes uden rebuild — rediger og genstart containeren.
      - ./data/allergens.yaml:/app/data/allergens.yaml:ro
    environment:
      OFF_USER_AGENT: "${OFF_USER_AGENT:-AllergiScan (selfhosted)}"
      HOUSEHOLD_NAME: "${HOUSEHOLD_NAME:-Vores husstand}"
      TZ: "${TZ:-Europe/Copenhagen}"
      COOKIE_SECURE: "${COOKIE_SECURE:-1}"
      SESSION_DAYS: "${SESSION_DAYS:-30}"
      CHECK_PWNED_PASSWORDS: "${CHECK_PWNED_PASSWORDS:-1}"
      MIN_PASSWORD_LEN: "${MIN_PASSWORD_LEN:-14}"
      TRUST_PROXY_AUTH: "${TRUST_PROXY_AUTH:-0}"
      TRUSTED_PROXY_HOSTS: "${TRUSTED_PROXY_HOSTS:-caddy}"
      DATABASE_URL: "${DATABASE_URL:-}"
      # Cloudflare Access. Tomme = slået fra, appen bruger lokale brugere.
      CF_ACCESS_TEAM_DOMAIN: "${CF_ACCESS_TEAM_DOMAIN:-}"
      CF_ACCESS_AUD: "${CF_ACCESS_AUD:-}"
      CF_ACCESS_ADMINS: "${CF_ACCESS_ADMINS:-}"
      # Google Sheets-link til den gamle godkendt-liste, så
      # `python -m app.cli import` kan hente den selv.
      LISTE_URL: "${LISTE_URL:-}"
      # OCR-containeren. Svarer den ikke, falder appen tilbage til den
      # indbyggede Tesseract-læsning — svagere, men appen dør ikke.
      OCR_URL: "${OCR_URL:-http://ocr:8000}"
    depends_on:
      ocr:
        condition: service_started
      postgres:
        condition: service_healthy

  # OCR i egen container: onnxruntime er native kode, og et segfault dér
  # må ikke tage web-appen og databasen med sig. Modellerne (~800 MB)
  # holdes samtidig ude af app-imaget, så udrulninger bliver ved med at
  # være hurtige. Se ocr_service/main.py.
  ocr:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    image: "${OCR_IMAGE:-allergiscan-ocr:local}"
    container_name: allergiscan-ocr
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Europe/Copenhagen}"
      # Hold OCR fra at æde hele serveren under en scanning.
      OMP_NUM_THREADS: "${OCR_THREADS:-4}"
    deploy:
      resources:
        limits:
          cpus: "${OCR_CPUS:-4}"

  # Ingress uden åbne porte. Se deploy/cloudflared/README.md — tunnellen
  # giver også HTTPS, hvilket kameraet KRÆVER: getUserMedia virker ikke
  # over http mod en LAN-adresse, så uden den er scanneren død på telefonen.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: allergiscan-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?sæt TUNNEL_TOKEN i .env}"
      TZ: "${TZ:-Europe/Copenhagen}"
    depends_on: [allergiscan]

  # Databasen i egen container. Data ligger på DIN disk via PGDATA_PATH —
  # containeren kan smides væk, databasen kan ikke.
  #
  # Appen bruger den KUN hvis DATABASE_URL er sat; ellers kører den videre
  # på SQLite-filen i /data. Skift kræver ét bevidst trin, fordi jeres
  # domme skal flyttes med:
  #   docker compose up -d postgres
  #   docker compose run --rm allergiscan python -m app.cli migrate /data/allergiscan.db
  # Se afsnittet om Postgres i deploy/UNRAID.md.
  postgres:
    image: postgres:17-alpine
    container_name: allergiscan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: allergiscan
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?sæt POSTGRES_PASSWORD i .env}"
      POSTGRES_DB: allergiscan
      TZ: "${TZ:-Europe/Copenhagen}"
    volumes:
      - ${PGDATA_PATH:-./pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allergiscan"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: allergiscan-caddy
    profiles: ["proxy"]
    restart: unless-stopped
    ports: ["443:443", "80:80"]
    volumes:
      # Kopiér deploy/Caddyfile.example til deploy/Caddyfile først.
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_PATH:-./caddy}:/data
    depends_on: [allergiscan, authelia]

  authelia:
    image: authelia/authelia:latest
    container_name: allergiscan-auth
    profiles: ["proxy"]
    restart: unless-stopped
    volumes:
      # Kopiér .example-filerne i deploy/authelia/ og udfyld dem først.
      - ./deploy/authelia:/config
    environment:
      TZ: "${TZ:-Europe/Copenhagen}"
